{{/*
EXERCISE M11-T3: Complete this Helm template.
Use values from values.yaml via {{ .Values.xxx }}.
The template must produce valid Kubernetes YAML.

Run to verify:
  helm lint helm/cloud-native-service/
  helm template cloud-native-service helm/cloud-native-service/ | kubectl apply --dry-run=client -f -
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-cloud-native
  labels:
    app: {{ .Release.Name }}-cloud-native
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  replicas: {{ .Values.replicaCount }}   {{/* TODO: should reference values.yaml */}}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-cloud-native
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-cloud-native
    spec:
      containers:
        - name: cloud-native-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          env:
            - name: APP_ENV
              value: {{ .Values.config.appEnv | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}    # TODO: fill in values.yaml
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}     # TODO: fill in values.yaml
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}

{{- if .Values.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Release.Name }}-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Release.Name }}-cloud-native
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
