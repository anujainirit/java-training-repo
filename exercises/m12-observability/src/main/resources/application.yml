spring:
  application:
    name: cloud-native-service

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0   # 100% sampling for dev/test

# Zipkin tracing endpoint (starts local Zipkin: docker run -p 9411:9411 openzipkin/zipkin)
zipkin:
  tracing:
    endpoint: http://localhost:9411/api/v2/spans
