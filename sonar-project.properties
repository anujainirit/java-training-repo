# SonarQube Quality Gate Configuration
# Applied via SonarCloud UI or sonar-project.properties
# This file documents the quality gate rules enforced on all PRs.

sonar.projectName=Java Backend Training
sonar.projectVersion=1.0

# Source & test paths
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

# Coverage
sonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml
sonar.java.coveragePlugin=jacoco

# Encoding
sonar.sourceEncoding=UTF-8

# Exclusions — don't scan generated code or config
sonar.exclusions=\
  **/dto/**,\
  **/entity/**,\
  **/model/**,\
  **/*Application.java,\
  **/*Config.java,\
  **/*Configuration.java,\
  **/generated/**

sonar.coverage.exclusions=\
  **/*Application.java,\
  **/*Config.java,\
  **/*Configuration.java,\
  **/dto/**,\
  **/entity/**,\
  **/model/**

# ═══════════════════════════════════════════════════════════════════════
# QUALITY GATE RULES (configure in SonarCloud UI under Quality Gates)
# Copy these as the "Training Zero Tolerance" quality gate:
#
#  Metric                       Operator   Threshold   On New Code
#  ──────────────────────────── ─────────  ──────────  ───────────
#  Bugs                         >          0           YES
#  Vulnerabilities              >          0           YES
#  Security Hotspots Reviewed   <          100%        YES
#  Code Smells (Blocker)        >          0           YES
#  Code Smells (Critical)       >          0           YES
#  Coverage                     <          85%         YES
#  Duplicated Lines (%)         >          3%          YES
#  Reliability Rating           worse than A           YES
#  Security Rating              worse than A           YES
#  Maintainability Rating       worse than A           YES
# ═══════════════════════════════════════════════════════════════════════
